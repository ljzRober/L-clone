# L-clone - Docker Compose 部署
# 用法: cp .env.example .env 并填写, 然后 docker compose up -d
services:
  lclone:
    build: .
    container_name: lclone
    restart: unless-stopped
    env_file: .env
    environment:
      - BRAIN_DB_PATH=/data/lclone.db
      # 洞察在 SQLite、进化资产内容在 <DB 目录>/evolution-blobs/ —— 都在 /data 这个持久化卷上。
      # LCLONE_EVO_DIR 只是本地物化缓存(可复现, 丢了 pull --all 就能重建); 放在卷上是为了
      # 顺带保留历史文件式资产, 便于 `lclone evolution migrate` 一次性摄入。
      - LCLONE_EVO_DIR=/data/evolutions
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # 记忆 + 进化资产内容库持久化在这里, 记得定期备份整个 data/
