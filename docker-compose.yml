# L-clone - Docker Compose 部署
# 用法: cp .env.example .env 并填写, 然后 docker compose up -d
services:
  lclone:
    build: .
    container_name: lclone
    restart: unless-stopped
    env_file: .env
    environment:
      - BRAIN_DB_PATH=/data/lclone.db
      # 服务器侧持久化只有两处: /data/lclone.db (洞察) 与 /data/evolution/ (进化资产库, 内容寻址)。
      # 容器内的 ~/.lclone/evolution/ 只是可复现的物化缓存, 不需要持久化也不需要挂载。
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # DB + 进化资产库都在这里, 备份整个 data/ 即可
