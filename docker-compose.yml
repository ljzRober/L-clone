# L-clone - Docker Compose 部署
# 用法: cp .env.example .env 并填写, 然后 docker compose up -d
services:
  lclone:
    build: .
    container_name: lclone
    restart: unless-stopped
    env_file: .env
    environment:
      - BRAIN_DB_PATH=/data/lclone.db
      # 洞察(insight)在 SQLite 里, 进化资产(evolution)是文件式的 —— 两者都放到持久化卷,
      # 才能一起备份/迁移 (否则容器重建时进化文件会丢)
      - LCLONE_EVO_DIR=/data/evolutions
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # 记忆 + 进化资产持久化在这里, 记得定期备份整个 data/
